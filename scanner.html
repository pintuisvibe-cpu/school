<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#08111d">
  <title>Gate Attendance Scanner</title>
  <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/dist/face-api.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08111d;color:#fff;font-family:system-ui,"Noto Sans Bengali",sans-serif}
    #qr-reader{position:fixed!important;inset:0;width:100%!important;height:100%!important;border:0!important;padding:0!important;overflow:hidden!important;background:#08111d!important}
    /* Never force both width:100% and height:100% with object-fit:cover on video:
       html5-qrcode crops using video.clientWidth/clientHeight vs videoWidth/videoHeight,
       so mismatched ratios squish the QR canvas on portrait phones. fitVideo() sets
       proportional cover dimensions instead. */
    #qr-reader video{position:absolute!important;left:50%!important;top:50%!important;transform:translate(-50%,-50%)!important;display:block!important;max-width:none!important;max-height:none!important}
    #qr-reader__dashboard,#qr-reader__status_span,#qr-shaded-region{display:none!important}
    /* This page does not load Tailwind, so every layout rule is written out here. */
    #topBar{position:absolute;top:0;left:0;right:0;z-index:4;padding:18px 16px 42px;background:linear-gradient(180deg,#000c,transparent);pointer-events:none}
    #brand{font-weight:900;letter-spacing:.04em;font-size:17px;padding-right:190px}
    #brand span{color:#6ee7b7}
    #statusText{margin:6px 0 0;font-size:14px;color:#ffffffe6;font-weight:600}
    #topActions{position:absolute;right:14px;top:14px;display:flex;gap:8px;align-items:flex-start;pointer-events:auto}
    .topBtn,#tokenSettings summary{list-style:none;cursor:pointer;border:1px solid #ffffff77;border-radius:10px;padding:9px 11px;font-size:12px;font-weight:700;background:#08111dd9;color:#fff;white-space:nowrap}
    #tokenSettings{position:relative}
    #tokenSettings form{position:absolute;right:0;top:calc(100% + 8px);width:min(88vw,300px);background:#122136;border:1px solid #475569;border-radius:14px;padding:16px;box-shadow:0 8px 30px #000b}
    #tokenSettings label,#tokenSettings p{display:block;font-size:13px;line-height:1.5;margin:0 0 9px}
    #tokenSettings input{width:100%;border:1px solid #94a3b8;border-radius:9px;padding:10px;color:#0f172a;background:white;margin-bottom:10px}
    #tokenSettings button{border:0;border-radius:9px;padding:9px 12px;background:#2563eb;color:white;font-weight:700;margin-right:8px;cursor:pointer}
    #tokenSettings #clearToken{background:#475569}
    #faceBanner{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);z-index:6;display:none;align-items:center;gap:12px;background:#0f172aeb;border:2px solid #34d399;border-radius:16px;padding:12px 16px;width:min(92vw,420px);box-shadow:0 12px 32px #000a}
    #faceBanner.show{display:flex}
    #faceBannerText{flex:1;font-size:14px;font-weight:700;line-height:1.4;color:#ecfdf5}
    #cancelWaitBtn{border:0;border-radius:10px;padding:8px 12px;background:#334155;color:#fff;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
    #resultOverlay{position:absolute;inset:0;z-index:10;display:none;align-items:center;justify-content:center;text-align:center;padding:28px}
    #startPanel{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:#020617;padding:28px;text-align:center}
    #startPanel.show{display:flex}
    #startPanel h1{margin:0;font-size:24px;font-weight:900}
    #startError{margin:14px 0 0;color:#e2e8f0;line-height:1.6}
    #startNote{margin:16px 0 0;font-size:12px;color:#94a3b8;line-height:1.6}
    #startBtn{margin-top:24px;border:0;border-radius:16px;background:#2563eb;color:#fff;padding:16px 28px;font-weight:700;font-size:16px;cursor:pointer}
    .viewfinder{position:absolute;z-index:2;left:50%;top:50%;width:min(72vw,340px);height:min(72vw,340px);transform:translate(-50%,-50%);border:3px solid white;border-radius:28px;box-shadow:0 0 0 9999px #06101a66,inset 0 0 24px #ffffff25;pointer-events:none;transition:border-color .2s}
    .viewfinder.qr-ok{border-color:#34d399}
    .viewfinder:after{content:'QR কোড ফ্রেমে রাখুন, তারপর মুখ ক্যামেরার সামনে ধরুন';position:absolute;left:-30px;right:-30px;top:calc(100% + 22px);text-align:center;color:white;font-weight:700;text-shadow:0 2px 10px #000}
  </style>
</head>
<body>
  <div id="qr-reader"></div>
  <header id="topBar">
    <div id="brand">SCHOOL GATE <span>• ATTENDANCE</span></div>
    <p id="statusText">ক্যামেরা চালু হচ্ছে…</p>
    <div id="topActions">
      <button id="flipCamBtn" class="topBtn" type="button" title="সামনে/পিছনের ক্যামেরা বদলান">🔄 ক্যামেরা</button>
      <details id="tokenSettings"><summary>API টোকেন</summary><form id="tokenForm">
        <label for="tokenInput">API_ACCESS_TOKEN (Supabase key নয়)</label>
        <input id="tokenInput" type="password" autocomplete="off" placeholder="API টোকেন লিখুন">
        <p id="tokenStatus" role="status"></p>
        <button type="submit">সেট করুন</button><button id="clearToken" type="button">মুছুন</button>
      </form></details>
    </div>
  </header>
  <div id="viewfinder" class="viewfinder"></div>
  <div id="faceBanner"><div id="faceBannerText">QR পাওয়া গেছে • মুখ ক্যামেরার সামনে রাখুন…</div><button id="cancelWaitBtn" type="button">বাতিল</button></div>
  <div id="resultOverlay"><div><div id="resultIcon" style="font-size:72px;margin-bottom:20px">✓</div><h1 id="resultTitle" style="font-size:clamp(34px,9vw,56px);font-weight:900;line-height:1.1"></h1><p id="resultDetail" style="margin-top:16px;font-size:18px;color:#ffffffe6"></p></div></div>
  <div id="startPanel"><div><h1>ক্যামেরা চালু হয়নি</h1><p id="startError"></p><button id="startBtn" type="button">আবার চেষ্টা করুন</button><p id="startNote">ক্যামেরার জন্য HTTPS লিংক ও camera permission দরকার। প্রথমবার face model ডাউনলোডে ইন্টারনেট দরকার।</p></div></div>
  <canvas id="captureCanvas" style="display:none"></canvas>
<script>
  const API_BASE_URL = ""; // Same-origin /scanner route. অন্য host-এ হোস্ট করলে সেই API URL বসান.
  const MODEL_URL = "https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/model";
  // Only the optional API_ACCESS_TOKEN goes here, NEVER the Supabase service key.
  const TOKEN_KEY = 'attendance_api_token';
  const $ = id => document.getElementById(id);

  function readToken(){
    let tok = '';
    try {
      const hash = window?.location?.hash || '';
      const m = hash.match(/(?:^#|&)token=([^&]+)/);
      if (m) {
        tok = decodeURIComponent(m[1]).trim();
        if (tok) {
          saveToken(tok);
          try { window.history?.replaceState?.(null, '', (window.location.pathname || '') + (window.location.search || '')); } catch(e) {}
          return tok;
        }
      }
    } catch(e) {}
    try { if (typeof localStorage !== 'undefined') tok = localStorage.getItem(TOKEN_KEY) || ''; } catch(e) {}
    if (!tok) { try { if (typeof sessionStorage !== 'undefined') tok = sessionStorage.getItem(TOKEN_KEY) || ''; } catch(e) {} }
    return tok;
  }
  function saveToken(tok){
    try { if (typeof localStorage !== 'undefined') localStorage.setItem(TOKEN_KEY, tok); } catch(e) {}
    try { if (typeof sessionStorage !== 'undefined') sessionStorage.setItem(TOKEN_KEY, tok); } catch(e) {}
  }
  function wipeToken(){
    try { if (typeof localStorage !== 'undefined') localStorage.removeItem(TOKEN_KEY); } catch(e) {}
    try { if (typeof sessionStorage !== 'undefined') sessionStorage.removeItem(TOKEN_KEY); } catch(e) {}
  }

  let apiToken = readToken();
  let authRequired = false;
  const authHeaders = () => apiToken ? {'Authorization': `Bearer ${apiToken}`} : {};
  $('tokenStatus').textContent = apiToken ? 'এই ডিভাইসে টোকেন সেভ করা আছে।' : 'টোকেন না লাগলে ফাঁকা রাখুন।';
  $('tokenForm').addEventListener('submit', e => {
    e.preventDefault();
    const token = $('tokenInput').value.trim();
    if (!token) { $('tokenStatus').textContent = 'টোকেন লিখুন।'; return; }
    apiToken = token;
    saveToken(apiToken);
    $('tokenInput').value = '';
    $('tokenStatus').textContent = 'এই ডিভাইসে টোকেন সেভ করা হয়েছে।';
    $('tokenSettings').open = false;
  });
  $('clearToken').addEventListener('click', () => {
    apiToken = '';
    wipeToken();
    $('tokenInput').value = '';
    $('tokenStatus').textContent = 'টোকেন মুছে ফেলা হয়েছে।';
  });
  fetch(`${API_BASE_URL}/health`).then(r => r.ok ? r.json() : null).then(data => {
    authRequired = !!data?.auth_required;
    if (authRequired && !apiToken) {
      $('tokenSettings').open = true;
      $('tokenStatus').textContent = 'স্ক্যান করার আগে একবার API টোকেন দিন (এই ডিভাইসে সেভ থাকবে)।';
    }
  }).catch(() => {});

  let scanner = null, starting = null, locked = false, resetTimer = null, audioContext = null, modelsPromise = null;
  let currentFacing = 'environment', waitCancelled = false, switchingCamera = false;

  // Keep video covering the viewport at its true natural aspect ratio so html5-qrcode
  // never distorts its capture canvas on portrait phones.
  function fitVideo(video){
    if (!video || !video.videoWidth || !video.videoHeight) return;
    const cw = window?.innerWidth || 0, ch = window?.innerHeight || 0;
    if (!cw || !ch) return;
    const scale = Math.max(cw / video.videoWidth, ch / video.videoHeight);
    video.style.width = `${Math.round(video.videoWidth * scale)}px`;
    video.style.height = `${Math.round(video.videoHeight * scale)}px`;
  }
  if (typeof MutationObserver !== 'undefined') {
    new MutationObserver(() => {
      const video = document.querySelector('#qr-reader video');
      if (video && !video.__fitBound) {
        video.__fitBound = true;
        ['loadedmetadata', 'loadeddata', 'playing', 'resize'].forEach(ev => video.addEventListener(ev, () => fitVideo(video)));
        fitVideo(video);
      }
    }).observe($('qr-reader'), {childList: true, subtree: true});
  }
  window?.addEventListener?.('resize', () => fitVideo(document.querySelector('#qr-reader video')));

  // Models load in the background after the camera starts. A failed load is cleared so the next scan retries.
  function loadModels(){
    if (!modelsPromise) {
      if (typeof faceapi === 'undefined') return Promise.reject(new Error('Face library লোড হয়নি। ইন্টারনেট সংযোগ দেখুন।'));
      modelsPromise = Promise.all([
        faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
        faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
        faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL),
      ]).catch(err => { modelsPromise = null; throw err; });
    }
    return modelsPromise;
  }
  function errText(e){ return `${e?.name||''} ${e?.message ?? e ?? ''}`; }
  function isPermissionError(e){ return /NotAllowed|Permission|denied/i.test(errText(e)); }
  function cameraErrorMessage(e){
    const t = errText(e);
    if (/InsecureContext/.test(t)) return 'ক্যামেরার জন্য HTTPS লিংক দরকার। https:// দিয়ে পেজটি খুলুন।';
    if (/NoMediaDevices/.test(t)) return 'এই ব্রাউজারে ক্যামেরা সাপোর্ট নেই। Chrome বা Safari দিয়ে খুলুন।';
    if (isPermissionError(e)) return 'ক্যামেরার অনুমতি দেওয়া হয়নি। ব্রাউজারের সাইট সেটিংস থেকে Camera → Allow করে পেজ রিলোড করুন।';
    if (/NotFound|DevicesNotFound/i.test(t)) return 'এই ডিভাইসে ক্যামেরা পাওয়া যায়নি।';
    if (/NotReadable|TrackStart|in use/i.test(t)) return 'ক্যামেরা অন্য অ্যাপ বা ট্যাবে ব্যবহার হচ্ছে। সেটি বন্ধ করে আবার চেষ্টা করুন।';
    if (/Overconstrained/i.test(t)) return 'ক্যামেরা এই সেটিং সমর্থন করে না।';
    return 'ক্যামেরা চালু হয়নি। ' + (e?.message ?? e ?? '');
  }
  function showStartError(e){
    console.error(e);
    $('statusText').textContent = 'ক্যামেরা চালু হয়নি';
    $('startError').textContent = cameraErrorMessage(e);
    $('startPanel').classList.add('show');
  }
  function soundQr(){
    try {
      audioContext = audioContext || new (window.AudioContext || window.webkitAudioContext)();
      if (audioContext.state === 'suspended') audioContext.resume();
      const osc = audioContext.createOscillator(), gain = audioContext.createGain();
      osc.connect(gain); gain.connect(audioContext.destination);
      osc.type = 'sine'; osc.frequency.value = 660;
      gain.gain.setValueAtTime(.0001, audioContext.currentTime);
      gain.gain.exponentialRampToValueAtTime(.14, audioContext.currentTime + .02);
      gain.gain.exponentialRampToValueAtTime(.0001, audioContext.currentTime + .14);
      osc.start(); osc.stop(audioContext.currentTime + .15);
    } catch(e) {}
  }
  function sound(success){
    try {
      audioContext = audioContext || new (window.AudioContext || window.webkitAudioContext)();
      if (audioContext.state === 'suspended') audioContext.resume();
      const osc = audioContext.createOscillator(), gain = audioContext.createGain();
      osc.connect(gain); gain.connect(audioContext.destination);
      osc.type = 'sine'; osc.frequency.value = success ? 880 : 210;
      gain.gain.setValueAtTime(.0001, audioContext.currentTime);
      gain.gain.exponentialRampToValueAtTime(.2, audioContext.currentTime + .03);
      gain.gain.exponentialRampToValueAtTime(.0001, audioContext.currentTime + .42);
      osc.start(); osc.stop(audioContext.currentTime + .43);
      if (success) setTimeout(() => {
        const o = audioContext.createOscillator(), g = audioContext.createGain();
        o.connect(g); g.connect(audioContext.destination);
        o.frequency.value = 1175;
        g.gain.setValueAtTime(.14, audioContext.currentTime);
        g.gain.exponentialRampToValueAtTime(.0001, audioContext.currentTime + .3);
        o.start(); o.stop(audioContext.currentTime + .31);
      }, 130);
    } catch(e) {}
  }
  function setFaceWaitUi(active, text = ''){
    if (active) {
      $('viewfinder')?.classList?.add('qr-ok');
      $('faceBanner')?.classList?.add('show');
    } else {
      $('viewfinder')?.classList?.remove('qr-ok');
      $('faceBanner')?.classList?.remove('show');
    }
    if (text) $('faceBannerText').textContent = text;
  }
  function resumeForNextScan(){
    setFaceWaitUi(false);
    $('resultOverlay').style.display = 'none';
    $('statusText').textContent = 'পরবর্তী শিক্ষার্থীর জন্য প্রস্তুত';
    try { scanner?.resume(); } catch(e) {}
    locked = false;
  }
  function showResult(ok, title, detail = ''){
    setFaceWaitUi(false);
    $('resultOverlay').style.display = 'flex';
    $('resultOverlay').style.background = ok ? '#047857' : '#b91c1c';
    $('resultIcon').textContent = ok ? '✓' : '!';
    $('resultTitle').textContent = title;
    $('resultDetail').textContent = detail;
    sound(ok);
    clearTimeout(resetTimer);
    resetTimer = setTimeout(resumeForNextScan, 3000);
  }

  $('cancelWaitBtn').addEventListener('click', () => {
    waitCancelled = true;
    resumeForNextScan();
  });

  async function descriptorFromLiveVideo(){
    // The face image stays in this device's memory. No raw image leaves the browser.
    await loadModels();
    const options = new faceapi.TinyFaceDetectorOptions({inputSize: 320, scoreThreshold: .5});
    const deadline = Date.now() + 6500;
    let lastCount = 0;
    while (true) {
      if (waitCancelled) throw new Error('__cancelled__');
      if (switchingCamera) { await new Promise(r => setTimeout(r, 150)); continue; }
      const video = document.querySelector('#qr-reader video');
      if (!video) throw new Error('লাইভ ক্যামেরা পাওয়া যায়নি।');
      if (video.readyState < 2) {
        await new Promise((resolve, reject) => {
          const t = setTimeout(() => reject(new Error('ক্যামেরা প্রস্তুত হয়নি।')), 2500);
          video.addEventListener('loadeddata', () => { clearTimeout(t); resolve(); }, {once: true});
        });
      }
      const faces = await faceapi.detectAllFaces(video, options).withFaceLandmarks().withFaceDescriptors();
      lastCount = faces.length;
      if (faces.length === 1) return Array.from(faces[0].descriptor);
      if (Date.now() >= deadline) break;
      const secsLeft = Math.max(1, Math.ceil((deadline - Date.now()) / 1000));
      const hint = faces.length === 0
        ? `QR পাওয়া গেছে • এখন মুখ ক্যামেরার সামনে ধরুন (${secsLeft}সে)`
        : `একাধিক মুখ দেখা যাচ্ছে — শুধু একজন সামনে থাকুন (${secsLeft}সে)`;
      $('statusText').textContent = hint;
      setFaceWaitUi(true, hint);
      await new Promise(r => setTimeout(r, 250));
    }
    throw new Error(lastCount === 0
      ? 'মুখ দেখা যায়নি—QR স্ক্যানের পর মুখটি ক্যামেরার সামনে রাখুন।'
      : 'ফ্রেমে একাধিক মুখ আছে—একজন করে স্ক্যান করুন।');
  }

  async function handleQr(qrText){
    if (locked) return;
    if (authRequired && !apiToken) {
      $('tokenSettings').open = true;
      $('tokenStatus').textContent = 'স্ক্যান করার আগে API টোকেন দিন।';
      locked = true;
      try { scanner.pause(false); } catch(e) {}
      showResult(false, 'API টোকেন দিন', 'উপরের ডানদিকে API টোকেন সেট করুন।');
      return;
    }
    $('tokenSettings').open = false;
    locked = true;
    waitCancelled = false;
    $('statusText').textContent = 'QR পড়া হয়েছে • মুখ যাচাই হচ্ছে…';
    setFaceWaitUi(true, 'QR পাওয়া গেছে • মুখ ক্যামেরার সামনে ধরুন…');
    soundQr();
    // Pause QR decoding, not the video: html5-qrcode's pause(false) keeps
    // frames flowing so descriptorFromLiveVideo can still read the face.
    try { scanner.pause(false); } catch(e) {}
    try {
      const descriptor = await descriptorFromLiveVideo();
      if (waitCancelled) return;
      setFaceWaitUi(false);
      $('statusText').textContent = 'মুখ মিলেছে • যাচাই চলছে…';
      const response = await fetch(`${API_BASE_URL}/api/verify-attendance`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json', ...authHeaders()},
        body: JSON.stringify({student_id: qrText.trim(), face_descriptor: descriptor}),
      });
      let result = {};
      try { result = await response.json(); } catch(e) {}
      if (response.status === 401) {
        $('tokenSettings').open = true;
        $('tokenStatus').textContent = 'API টোকেন প্রয়োজন বা সঠিক নয়।';
        showResult(false, 'API টোকেন দিন', 'উপরের ডানদিকে API টোকেন সেট করুন।');
        return;
      }
      if (response.ok && result.status === 'success') {
        showResult(true, `Present: ${result.student_name}`, `সময়: ${result.time || ''}`);
      } else {
        const reason = result.reason || result.detail || 'Face Mismatch!';
        showResult(false, reason === 'Face Mismatch!' ? 'Face Mismatch!' : 'যাচাই ব্যর্থ', reason);
      }
    } catch(e) {
      if (e?.message === '__cancelled__' || waitCancelled) return;
      showResult(false, 'যাচাই করা যায়নি', e.message || 'নেটওয়ার্ক/ক্যামেরা সমস্যা।');
    }
  }

  function buildScanConfig(facing){
    return {
      fps: 12,
      disableFlip: facing === 'environment',
      qrbox: (w, h) => {
        const minWin = Math.min(window?.innerWidth || w, window?.innerHeight || h);
        const s = Math.max(120, Math.min(Math.floor(minWin * 0.82), 380, Math.floor(Math.min(w, h) * 0.92)));
        return {width: s, height: s};
      },
    };
  }

  // Camera is requested first, so the permission prompt and preview do not wait for the face models.
  function startCamera(preferredFacing){
    if (preferredFacing) currentFacing = preferredFacing;
    if (scanner?.isScanning && !preferredFacing) return Promise.resolve();
    if (starting) return starting;
    starting = (async () => {
      $('startPanel').classList.remove('show');
      $('statusText').textContent = 'ক্যামেরা চালু হচ্ছে…';
      if (!window.isSecureContext) throw new Error('InsecureContext');
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('NoMediaDevices');
      if (!scanner) {
        scanner = new Html5Qrcode('qr-reader', {
          verbose: false,
          formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE],
        });
      }
      try {
        await scanner.start({facingMode: currentFacing}, buildScanConfig(currentFacing), handleQr, () => {});
      } catch(e) {
        if (isPermissionError(e)) throw e;
        currentFacing = currentFacing === 'environment' ? 'user' : 'environment';
        await scanner.start({facingMode: currentFacing}, buildScanConfig(currentFacing), handleQr, () => {});
      }
      fitVideo(document.querySelector('#qr-reader video'));
      if (!locked) $('statusText').textContent = 'QR কোড ফ্রেমে রাখুন';
      loadModels().catch(() => {
        if (!locked) $('statusText').textContent = 'Face model লোড হয়নি। ইন্টারনেট সংযোগ দেখুন।';
      });
    })().finally(() => { starting = null; });
    return starting;
  }

  $('flipCamBtn').addEventListener('click', async () => {
    if (switchingCamera) return;
    switchingCamera = true;
    const nextFacing = currentFacing === 'environment' ? 'user' : 'environment';
    try {
      if (scanner?.isScanning || scanner?.getState?.() === 3) {
        await scanner.stop();
      }
    } catch(e) {}
    try {
      await startCamera(nextFacing);
      if (locked) {
        try { scanner.pause(false); } catch(e) {}
      }
    } catch(e) {
      showStartError(e);
    } finally {
      switchingCamera = false;
    }
  });

  $('startBtn').addEventListener('click', () => startCamera().catch(showStartError));
  startCamera().catch(showStartError);
</script>
</body></html>
