<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#070f22">
  <title>গেট স্ক্যানার · School ID</title>
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/app.css">
  <style>
    html,body{margin:0;height:100%;overflow:hidden;background:#070f22;color:#fff;font-family:var(--font)}
    #stage{position:fixed;inset:0}
    #video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
    #overlayCanvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
    .scrim{position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 50% 42%, transparent 30%, rgba(4,9,20,.78) 78%)}
    .top{position:absolute;top:0;left:0;right:0;z-index:5;padding:18px 18px 26px;background:linear-gradient(180deg,rgba(3,7,18,.86),transparent);display:flex;align-items:center;gap:12px}
    .top .brandmark{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:var(--gold-soft)}
    .top h1{margin:0;font-size:15px;font-weight:800;letter-spacing:-.01em}
    .top p{margin:2px 0 0;font-size:12px;color:#a8bcd8}
    .clock{margin-left:auto;text-align:right}
    .clock b{display:block;font-size:20px;font-variant-numeric:tabular-nums;letter-spacing:.04em}
    .clock span{font-size:11px;color:#93a8c7}
    .frame{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);width:min(74vw,330px);aspect-ratio:1;border-radius:26px;z-index:3;pointer-events:none;
      box-shadow:0 0 0 3px rgba(255,255,255,.9), 0 0 0 9999px rgba(4,9,20,.32), inset 0 0 40px rgba(59,130,246,.18)}
    .frame::before,.frame::after{content:"";position:absolute;width:46px;height:46px;border:4px solid var(--gold);border-radius:16px}
    .frame::before{top:-6px;left:-6px;border-right:0;border-bottom:0}
    .frame::after{bottom:-6px;right:-6px;border-left:0;border-top:0}
    .scanline{position:absolute;left:10px;right:10px;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,#7fd1ff,#c8f3ff,#7fd1ff,transparent);box-shadow:0 0 18px #7fd1ff;animation:scan 2.6s ease-in-out infinite;top:14px}
    @keyframes scan{0%,100%{top:14px;opacity:.2}50%{top:calc(100% - 16px);opacity:1}}
    .hint{position:absolute;left:0;right:0;top:calc(46% + min(37vw,165px) + 18px);text-align:center;z-index:3;pointer-events:none;font-weight:700;font-size:14px;text-shadow:0 2px 12px #000}
    .hint span{display:inline-block;padding:7px 16px;border-radius:999px;background:rgba(8,17,34,.66);border:1px solid rgba(255,255,255,.16)}
    .dock{position:absolute;left:0;right:0;bottom:0;z-index:6;padding:14px 16px calc(16px + env(safe-area-inset-bottom));display:flex;gap:10px;justify-content:center;background:linear-gradient(0deg,rgba(3,7,18,.9),transparent)}
    .dock button{border-radius:14px;padding:12px 18px;font-weight:700;font-size:13.5px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:#fff;backdrop-filter:blur(10px)}
    .dock button.primary{background:var(--brand);border-color:transparent}
    .result{position:fixed;inset:0;z-index:30;display:none;place-items:center;padding:26px;text-align:center;background:#065f46}
    .result.show{display:grid}
    .result.fail{background:#9f1239}
    .result .icon{font-size:66px;line-height:1}
    .result h2{font-size:clamp(26px,7vw,42px);font-weight:800;margin:14px 0 0;letter-spacing:-.02em}
    .result p{color:#ffffffdd;font-size:16px;margin-top:10px}
    .result .meta{margin-top:18px;display:inline-grid;gap:6px;font-size:13px;color:#ffffffbb}
    .start{position:fixed;inset:0;z-index:40;display:none;place-items:center;background:#040a16;padding:26px;text-align:center}
    .start.show{display:grid}
    .start .card-inner{max-width:420px}
    .start h2{font-size:24px;margin:0}
    .start p{color:#a9bcd8;font-size:13.5px;line-height:1.6;margin-top:12px}
    .startError{color:#fecaca;font-size:13px;margin-top:10px;line-height:1.6}
    .start button{margin-top:22px;border:0;border-radius:14px;background:var(--brand);color:#fff;padding:14px 26px;font-weight:800;font-size:15px}
    .manual{margin-top:18px;display:grid;gap:8px}
    .manual input{border-radius:12px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#fff;padding:11px 14px;font-size:14px;text-align:center}
  </style>
</head>
<body>
  <div id="stage">
    <video id="video" playsinline muted autoplay></video>
    <canvas id="overlayCanvas"></canvas>
    <div class="scrim"></div>
    <header class="top">
      <div class="brandmark" id="brandMark">S</div>
      <div><h1 id="schoolName">গেট স্ক্যানার</h1><p id="statusText">ক্যামেরা চালু হচ্ছে…</p></div>
      <div class="clock"><b id="clock">--:--</b><span id="todayLabel">আজ</span></div>
    </header>
    <div class="frame"><div class="scanline"></div></div>
    <div class="hint" id="hint"><span id="hintText">কার্ডের QR ফ্রেমে ধরুন</span></div>
    <div class="dock">
      <button id="flipBtn" type="button">🔄 ক্যামেরা</button>
      <button id="manualBtn" type="button">⌨ আইডি লিখুন</button>
      <button id="soundBtn" type="button" class="primary" aria-pressed="true">🔔 শব্দ চালু</button>
    </div>
  </div>

  <div class="result" id="result">
    <div>
      <div class="icon" id="resultIcon">✓</div>
      <h2 id="resultTitle">উপস্থিতি</h2>
      <p id="resultDetail"></p>
      <div class="meta" id="resultMeta"></div>
    </div>
  </div>

  <div class="start" id="startPanel">
    <div class="card-inner">
      <h2>ক্যামেরা চালু হয়নি</h2>
      <p id="startError">ক্যামেরার অনুমতি দিন অথবা আইডি লিখে উপস্থিতি নিন।</p>
      <div class="manual">
        <input id="manualToken" placeholder="কার্ড টোকেন / QR টেক্সট" autocomplete="off">
        <input id="manualId" placeholder="অথবা Student ID" autocomplete="off">
      </div>
      <button id="startBtn" type="button">আবার চেষ্টা করুন</button>
      <button id="manualGo" type="button" style="background:rgba(255,255,255,.12);margin-left:8px">ম্যানুয়ালি চালান</button>
      <p style="margin-top:16px;font-size:11.5px;color:#7f93b3">ক্যামেরার জন্য HTTPS দরকার। QR + লাইভ মুখ মিলিয়ে উপস্থিতি নেওয়া হয়; ছবি কোথাও আপলোড হয় না।</p>
    </div>
  </div>

  <script src="/static/vendor/face-api.js"></script>
  <script src="/static/vendor/jsQR.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/common.js"></script>
  <script>
    (function () {
      const S = School;
      const $ = S.$;
      const video = $("video");
      const canvas = $("overlayCanvas");
      const ctx = canvas.getContext("2d", { willReadFrequently: true });
      const state = { stream: null, running: false, busy: false, sound: true, facing: "environment", modelsReady: false, lastScan: 0, raf: 0 };
      let audioCtx = null;

      /* ---- UI bits ------------------------------------------------- */
      function beep(kind) {
        if (!state.sound) return;
        try {
          audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
          if (audioCtx.state === "suspended") audioCtx.resume();
          const seq = kind === "ok" ? [660, 990] : [300, 200];
          seq.forEach((freq, i) => {
            const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.type = "sine"; osc.frequency.value = freq;
            const t0 = audioCtx.currentTime + i * 0.16;
            gain.gain.setValueAtTime(0.0001, t0);
            gain.gain.exponentialRampToValueAtTime(0.18, t0 + 0.03);
            gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.28);
            osc.start(t0); osc.stop(t0 + 0.3);
          });
        } catch (e) {}
      }

      function showResult(ok, title, detail, meta) {
        const r = $("result");
        r.classList.toggle("fail", !ok);
        $("resultIcon").textContent = ok ? "✓" : "!";
        $("resultTitle").textContent = title;
        $("resultDetail").textContent = detail || "";
        $("resultMeta").innerHTML = meta || "";
        r.classList.add("show");
        beep(ok ? "ok" : "err");
        setTimeout(() => {
          r.classList.remove("show");
          state.busy = false;
          $("statusText").textContent = "পরবর্তী শিক্ষার্থীর জন্য প্রস্তুত";
        }, ok ? 3200 : 3800);
      }

      function tickClock() {
        const now = new Date();
        $("clock").textContent = new Intl.DateTimeFormat("en-GB", { hour: "2-digit", minute: "2-digit", timeZone: "Asia/Dhaka" }).format(now);
        $("todayLabel").textContent = S.fmtDate(now.toISOString(), { day: "numeric", month: "short" });
      }
      tickClock();
      setInterval(tickClock, 15000);

      /* ---- camera -------------------------------------------------- */
      async function startCamera() {
        $("startPanel").classList.remove("show");
        $("statusText").textContent = "ক্যামেরা চালু হচ্ছে…";
        try {
          if (state.stream) state.stream.getTracks().forEach((t) => t.stop());
          state.stream = await S.startCamera(video, { facing: state.facing });
          await video.play().catch(() => {});
          state.running = true;
          $("statusText").textContent = "QR স্ক্যান হচ্ছে";
          requestAnimationFrame(loop);
          loadModels();
        } catch (err) {
          showStart(S.cameraErrorMessage(err));
        }
      }

      function showStart(msg) {
        $("startPanel").classList.add("show");
        $("startError").textContent = msg || "ক্যামেরা চালু হয়নি";
        $("statusText").textContent = "ক্যামেরা বন্ধ";
      }

      async function loadModels() {
        try {
          await S.loadModels();
          state.modelsReady = true;
          $("statusText").textContent = "QR স্ক্যান হচ্ছে • ফেস ভেরিফিকেশন প্রস্তুত";
        } catch (e) {
          $("statusText").textContent = "Face model লোড হয়নি — ইন্টারনেট দেখুন";
        }
      }

      function fitCanvas() {
        const w = video.videoWidth || 1280, h = video.videoHeight || 720;
        if (canvas.width !== w || canvas.height !== h) {
          canvas.width = w; canvas.height = h;
        }
        return { w, h };
      }

      /* ---- scanning loop ------------------------------------------- */
      async function loop() {
        if (!state.running) return;
        state.raf = requestAnimationFrame(loop);
        if (state.busy || video.readyState < 2) return;
        const now = performance.now();
        if (now - state.lastScan < 260) return;
        state.lastScan = now;
        const { w, h } = fitCanvas();
        ctx.drawImage(video, 0, 0, w, h);
        let image = null;
        try {
          image = ctx.getImageData(0, 0, w, h);
        } catch (e) {
          return;
        }
        const code = window.jsQR ? jsQR(image.data, w, h, { inversionAttempts: "dontInvert" }) : null;
        if (!code || !code.data) return;
        await onCode(code.data);
      }

      function parseQr(text) {
        // Accept a raw token, a /card?t=… URL, or a JSON blob.
        const raw = String(text || "").trim();
        if (!raw) return "";
        try {
          const u = new URL(raw);
          const t = u.searchParams.get("t");
          if (t) return t;
        } catch (e) {}
        try {
          const j = JSON.parse(raw);
          if (j && (j.card_token || j.token)) return j.card_token || j.token;
        } catch (e) {}
        return raw;
      }

      async function onCode(text) {
        if (state.busy) return;
        state.busy = true;
        const token = parseQr(text);
        $("statusText").textContent = "QR পড়া হয়েছে • মুখ যাচাই হচ্ছে…";
        $("hintText").textContent = "ক্যামেরার দিকে তাকান…";
        try {
          let descriptor = null;
          if (state.modelsReady || typeof faceapi !== "undefined") {
            try {
              descriptor = await descriptorFromVideo();
            } catch (e) {
              descriptor = null;
              var faceErr = e.message;
            }
          }
          const payload = { p_token: token };
          if (descriptor) payload.p_descriptor = descriptor;
          const res = await S.rpc("gate_attendance", payload);
          if (!res || res.status !== "success") {
            const reason = res?.reason || "যাচাই ব্যর্থ";
            return showResult(false, reason === "Face Mismatch!" ? "Face Mismatch!" : "যাচাই ব্যর্থ", reason, faceErr ? `<span>${S.esc(faceErr)}</span>` : "");
          }
          const meta = `<span>${S.esc(res.class_name || "")}${res.section ? " • শাখা " + S.esc(res.section) : ""}</span>
            <span>${res.already_marked ? "আজ আগেই উপস্থিতি নেওয়া হয়েছে" : "উপস্থিতি রেকর্ড হয়েছে — " + S.esc(res.time)}</span>
            <span class="mono">ID: ${S.esc(res.student_id)} • দূরত্ব ${S.esc(String(res.distance ?? ""))}</span>`;
          showResult(true, `উপস্থিত: ${res.student_name}`, res.already_marked ? "ডাবল স্ক্যান — আজকের রেকর্ড অপরিবর্তিত" : "শুভ সকাল! উপস্থিতি নেওয়া হয়েছে।", meta);
          $("statusText").textContent = "উপস্থিতি রেকর্ড হয়েছে";
        } catch (err) {
          showResult(false, "সংযোগ সমস্যা", err.message || "নেটওয়ার্ক সমস্যা");
        } finally {
          $("hintText").textContent = "কার্ডের QR ফ্রেমে ধরুন";
        }
      }

      async function descriptorFromVideo() {
        if (!state.modelsReady) await S.loadModels();
        if (video.readyState < 2) throw new Error("ক্যামেরা প্রস্তুত হয়নি।");
        const faces = await faceapi
          .detectAllFaces(video, new faceapi.TinyFaceDetectorOptions({ inputSize: 320, scoreThreshold: 0.5 }))
          .withFaceLandmarks()
          .withFaceDescriptors();
        if (faces.length === 0) throw new Error("মুখ দেখা যায়নি — ক্যামেরার সামনে তাকান।");
        if (faces.length > 1) throw new Error("একাধিক মুখ — একজন করে স্ক্যান করুন।");
        return Array.from(faces[0].descriptor);
      }

      /* ---- manual fallback ---------------------------------------- */
      async function manualAttendance() {
        const token = $("manualToken").value.trim() || parseQr($("manualToken").value.trim());
        const id = $("manualId").value.trim();
        if (!token && !id) return S.toast("টোকেন বা Student ID দিন।", "warn");
        $("startPanel").classList.remove("show");
        if (token) return runManual({ p_token: token });
        // Student ID alone is not enough for face verification: the DB requires the card token.
        S.toast("Student ID দিয়ে গেটে উপস্থিতি নেওয়া যায় না — কার্ডের QR টোকেন দিন।", "warn", 6000);
        $("startPanel").classList.add("show");
      }

      async function runManual(args) {
        state.busy = true;
        try {
          const res = await S.rpc("gate_attendance", args);
          if (!res || res.status !== "success") {
            return showResult(false, res?.reason === "Face Mismatch!" ? "Face Mismatch!" : "যাচাই ব্যর্থ", res?.reason || "কার্ডটি বৈধ নয়");
          }
          showResult(true, `উপস্থিত: ${res.student_name}`, res.already_marked ? "আজ আগেই উপস্থিতি নেওয়া হয়েছে" : "উপস্থিতি রেকর্ড হয়েছে", `<span>${S.esc(res.class_name || "")} • ${S.esc(res.time)}</span>`);
        } catch (err) {
          showResult(false, "সংযোগ সমস্যা", err.message);
        }
      }

      /* ---- controls ----------------------------------------------- */
      $("startBtn").addEventListener("click", startCamera);
      $("manualGo").addEventListener("click", manualAttendance);
      $("manualBtn").addEventListener("click", () => {
        $("startPanel").classList.add("show");
        $("startError").textContent = "কার্ডের QR টেক্সট বা টোকেন লিখে ম্যানুয়ালি উপস্থিতি নিন।";
        $("manualToken").focus();
      });
      $("flipBtn").addEventListener("click", async () => {
        state.facing = state.facing === "environment" ? "user" : "environment";
        await startCamera();
      });
      $("soundBtn").addEventListener("click", () => {
        state.sound = !state.sound;
        $("soundBtn").textContent = state.sound ? "🔔 শব্দ চালু" : "🔕 শব্দ বন্ধ";
        $("soundBtn").setAttribute("aria-pressed", String(state.sound));
        if (state.sound) beep("ok");
      });
      $("manualToken").addEventListener("keydown", (e) => e.key === "Enter" && manualAttendance());
      $("manualId").addEventListener("keydown", (e) => e.key === "Enter" && manualAttendance());

      (async function init() {
        try {
          const settings = await S.rpc("public_settings");
          if (settings && settings.school_name) {
            $("schoolName").textContent = settings.school_name;
            document.title = `গেট স্ক্যানার · ${settings.school_name}`;
          }
        } catch (e) {}
        await startCamera();
      })();
    })();
  </script>
</body>
</html>
