services:
  - type: web
    name: school-attendance
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.2
      # Public project URL is safe to track; the privileged key is not.
      - key: SUPABASE_URL
        value: https://nojpjuowrhinkxpzumum.supabase.co
      - key: SUPABASE_SERVICE_KEY
        sync: false
      # Render generates a private random token if none exists. Find its value
      # in the service's Environment tab to enter it in /admin and /scanner.
      - key: API_ACCESS_TOKEN
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
